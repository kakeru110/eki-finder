<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お問い合わせ｜集合駅ナビ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="集合駅ナビへのお問い合わせフォームです。ご意見・不具合報告・未登録駅のご連絡などをお寄せください。">
<link rel="canonical" href="https://kakeru110.github.io/eki-finder/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="集合駅ナビ">
<meta property="og:title" content="お問い合わせ｜集合駅ナビ">
<meta property="og:description" content="集合駅ナビへのお問い合わせフォームです。ご意見・不具合報告・未登録駅のご連絡などをお寄せください。">
<meta property="og:url" content="https://kakeru110.github.io/eki-finder/contact.html">
<meta property="og:image" content="https://kakeru110.github.io/eki-finder/og-image.png">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="お問い合わせ｜集合駅ナビ">
<meta name="twitter:image" content="https://kakeru110.github.io/eki-finder/og-image.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1c3a5e">
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --accent: #1c3a5e;
    --accent-dark: #142b47;
    --accent-2: #f28c1a;
    --text: #1f2430;
    --muted: #5b6472;
    --border: #d7dce2;
    --good: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 3px solid var(--accent);
    color: var(--text);
    padding: 12px 16px;
  }
  header .head-inner { max-width: 480px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 900; }
  header h1 a { color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  header h1 a .logo-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; background: var(--accent); border-radius: 5px; flex-shrink: 0;
  }
  header h1 a .logo-mark svg { width: 14px; height: 14px; }
  header p { margin: 5px 0 0; font-size: 0.78rem; color: var(--muted); }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 12px 32px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 10px;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
  }
  .intro { font-size: 0.82rem; color: var(--text); margin: 0 0 12px; }
  .sent-banner {
    background: #ecfdf5;
    color: var(--good);
    border: 1px solid #a7f3d0;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 0.82rem;
    margin-bottom: 12px;
  }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--muted); }
  .required { color: #e11d48; font-size: 0.68rem; margin-left: 4px; }
  input, textarea {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; }
  button {
    margin-top: 4px;
    padding: 11px;
    border: none;
    border-radius: 4px;
    background: var(--accent-2);
    color: #fff;
    font-size: 0.92rem;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { opacity: 0.9; }
  .disclaimer { font-size: 0.66rem; color: var(--muted); margin-top: 10px; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --card: #1b212b;
      --accent: #6f9bc9;
      --accent-dark: #0a0f16;
      --accent-2: #f6a53d;
      --text: #e8ecf1;
      --muted: #93a0b0;
      --border: #2c3542;
    }
    input, textarea { background: #1b212b; color: var(--text); }
    .sent-banner { background: #0f2a20; border-color: #14532d; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <h1><a href="index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 13h16M8 21l2-4h4l2 4M9 9h.01M15 9h.01"/></svg></span>集合駅ナビ</a></h1>
    <p>お問い合わせ</p>
  </div>
</header>

<main>
  <a class="back-link" href="index.html">← ツールに戻る</a>
  <div class="card">
    <p class="intro">ご意見・不具合報告・未登録駅のご連絡などをお寄せください。いただいた内容は運営者宛にメールで届きます。</p>

    <div id="sentBanner" class="sent-banner" hidden>✅ 送信しました。ありがとうございます。</div>

    <form action="https://formsubmit.co/kakeru.senoo@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【集合駅ナビ】お問い合わせ">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="https://kakeru110.github.io/eki-finder/contact.html?sent=1">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <label>
        お名前(任意)
        <input type="text" name="name" placeholder="山田太郎" autocomplete="name">
      </label>
      <label>
        メールアドレス<span class="required">必須</span>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </label>
      <label>
        件名(任意)
        <input type="text" name="subject" placeholder="例: 未登録駅について">
      </label>
      <label>
        お問い合わせ内容<span class="required">必須</span>
        <textarea name="message" rows="6" placeholder="内容をご記入ください" required></textarea>
      </label>
      <button type="submit">送信する</button>
    </form>

    <p class="disclaimer">このフォームは外部サービス(FormSubmit)を利用して送信内容をメールに転送しています。個人情報(お名前・メールアドレス等)はお問い合わせ対応の目的以外には使用しません。</p>
  </div>
</main>

<script>
  if (new URLSearchParams(location.search).get("sent") === "1") {
    document.getElementById("sentBanner").hidden = false;
  }
</script>
</body>
</html>

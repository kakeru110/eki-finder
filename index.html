<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>合流駅ファインダー</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f1f2f6;
    --card: #ffffff;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-soft: #eef0ff;
    --text: #14171f;
    --muted: #6b7280;
    --border: #e3e5ea;
    --good: #16a34a;
    --warn: #b45309;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    font-size: 15px;
  }
  header {
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #fff;
    padding: 16px 16px 14px;
  }
  header .head-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 720px;
    margin: 0 auto;
  }
  header h1 { margin: 0; font-size: 1.15rem; white-space: nowrap; }
  header p { margin: 2px 0 0; opacity: 0.92; font-size: 0.78rem; max-width: 720px; margin-left: auto; margin-right: auto; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 12px 50px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(20,23,31,0.04);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card h2 .count-badge {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
  }
  .people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 8px;
  }
  .person {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 9px 9px;
    background: #fafbfc;
  }
  .person-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .person-head .p-name {
    flex: 1;
    border: none;
    background: transparent;
    font-weight: 700;
    font-size: 0.86rem;
    padding: 2px 2px;
    color: var(--text);
    min-width: 0;
  }
  .person-head .p-name::placeholder { color: #9aa0ab; font-weight: 600; }
  .remove-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .p-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .field label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    margin: 0 0 2px 1px;
  }
  .station-field { position: relative; }
  .station-field input {
    width: 100%;
    padding: 6px 7px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 0.85rem;
    background: #fff;
  }
  .station-field input.invalid {
    border-color: var(--danger);
    background: var(--danger-soft);
  }
  .field-error {
    font-size: 0.66rem;
    color: var(--danger);
    margin-top: 2px;
    min-height: 0;
  }
  .field-error:empty { display: none; }
  .suggestions {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(20,23,31,0.12);
    max-height: 180px;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 4px;
  }
  .suggestions li {
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.83rem;
    cursor: pointer;
  }
  .suggestions li:hover,
  .suggestions li.active {
    background: var(--accent-soft);
  }
  .add-person-btn {
    margin-top: 8px;
    width: 100%;
    padding: 8px;
    border: 1px dashed #c7cbd6;
    border-radius: 9px;
    background: #fff;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .add-person-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    color: var(--muted);
  }
  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .mode-tabs button {
    padding: 9px 6px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
  }
  .mode-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mode-desc {
    font-size: 0.76rem;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .inline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 0.8rem;
  }
  .inline-row input[type="time"] {
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 0.82rem;
  }
  .run-btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .run-btn:active { opacity: 0.85; }
  .form-error {
    font-size: 0.78rem;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }
  .form-error.show { display: block; }
  .notice {
    font-size: 0.72rem;
    color: var(--warn);
    background: #fff8ec;
    border: 1px solid #f1dcb0;
    border-radius: 8px;
    padding: 7px 9px;
    margin-top: 8px;
  }
  #results { margin-top: 2px; }
  .result-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
  }
  .result-item.rank-1 {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  .result-head .station-name {
    font-size: 0.98rem;
    font-weight: 700;
  }
  .result-head .badge {
    font-size: 0.68rem;
    background: var(--accent);
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .result-head .score {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .per-person {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 4px 10px;
    margin-top: 6px;
    font-size: 0.76rem;
    color: var(--text);
  }
  .per-person .approx { color: var(--muted); }
  .empty-hint {
    color: var(--muted);
    font-size: 0.84rem;
    text-align: center;
    padding: 16px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
    padding: 8px 16px 28px;
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>🚉 合流駅ファインダー</h1>
  </div>
  <p>何人でも(2〜8人)の職場・自宅最寄駅を入力して、公平に集まれる駅を提案します</p>
</header>

<main>

  <section class="card">
    <h2>1. 最寄駅を入力 <span class="count-badge" id="peopleCountBadge"></span></h2>
    <div class="people-grid" id="peopleGrid"></div>
    <button class="add-person-btn" id="addPersonBtn">＋ 人を追加</button>
  </section>

  <section class="card">
    <h2>2. 重視するモード</h2>
    <div class="mode-tabs" id="modeTabs"></div>
    <p class="mode-desc" id="modeDesc"></p>
    <div class="inline-row" id="lastTrainRow" style="display:none;">
      <label for="breakupTime">解散予定時刻</label>
      <input type="time" id="breakupTime" value="21:30">
    </div>
    <button class="run-btn" id="runBtn">合流駅を探す</button>
    <p class="form-error" id="formError"></p>
    <p class="notice">
      ⚠️ 実際の乗換案内APIに未接続のため、所要時間・終電は駅の位置関係からの<strong>概算値</strong>です。実際の乗換時間・終電時刻とは異なります。
    </p>
  </section>

  <section class="card">
    <h2>3. 提案結果</h2>
    <div id="results"><p class="empty-hint">駅を入力して「合流駅を探す」を押してください</p></div>
  </section>

</main>

<footer>
  合流駅ファインダー — 概算版(実データ未接続) / <span id="candidateCount"></span>駅を候補として計算
</footer>

  ["若松河田",35.6961,139.7181],["牛込柳町",35.6994,139.7256],["牛込神楽坂",35.7008,139.7358],
  ["春日",35.7061,139.7522],["本郷三丁目",35.7075,139.7594],["上野御徒町",35.7075,139.7742],
  ["新御徒町",35.7061,139.7794],["蔵前",35.7047,139.7889],
];

const stationMap = new Map(STATIONS.map(s => [s[0], {lat:s[1], lon:s[2]}]));
document.getElementById("candidateCount").textContent = STATIONS.length;

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(h));
}
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h;
}
// 駅間の概算所要時間(分)。直線距離×補正+乗換等の基礎時間+揺らぎ
function approxTravelMinutes(nameA, nameB) {
  const a = stationMap.get(nameA), b = stationMap.get(nameB);
  if (!a || !b) return null;
  if (nameA === nameB) return 0;
  const km = haversineKm(a, b);
  const jitter = Math.abs(hashStr(nameA + "|" + nameB) % 9) - 4;
  const minutes = km * 2.1 + 12 + jitter;
  return Math.max(5, Math.round(minutes));
}
// 概算終電時刻(分, 0:00起点。都心ほど遅く、郊外ほど早い想定)
function approxLastTrainMinutes(stationName) {
  const s = stationMap.get(stationName);
  if (!s) return null;
  const center = { lat: 35.6812, lon: 139.7671 };
  const km = haversineKm(s, center);
  const t = 1470 - km * 1.5;
  return Math.max(1380, Math.min(1470, t));
}

// ---- 人数の動的管理 ----
const MIN_PEOPLE = 2;
const MAX_PEOPLE = 8;
let nextId = 1;
let peopleIds = [];
const peopleData = new Map(); // id -> {name, work, home}

function ensureData(id) {
  if (!peopleData.has(id)) peopleData.set(id, { name: "", work: "", home: "" });
  return peopleData.get(id);
}

const peopleGrid = document.getElementById("peopleGrid");
const addPersonBtn = document.getElementById("addPersonBtn");
const peopleCountBadge = document.getElementById("peopleCountBadge");

function renderPeople() {
  peopleGrid.innerHTML = peopleIds.map((id, idx) => {
    const d = ensureData(id);
    const canRemove = peopleIds.length > MIN_PEOPLE;
    return `
      <div class="person" data-id="${id}">
        <div class="person-head">
          <input class="p-name" placeholder="${idx + 1}人目の名前(任意)" value="${escapeAttr(d.name)}">
          <button class="remove-btn" data-remove="${id}" ${canRemove ? "" : "disabled"} title="この人を削除">✕</button>
        </div>
        <div class="p-fields">
          <div class="field">
            <label>職場の最寄駅</label>
            <div class="station-field">
              <input class="station-input p-work" autocomplete="off" placeholder="例: 新宿" value="${escapeAttr(d.work)}">
              <ul class="suggestions"></ul>
            </div>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label>自宅の最寄駅</label>
            <div class="station-field">
              <input class="station-input p-home" autocomplete="off" placeholder="例: 町田" value="${escapeAttr(d.home)}">
              <ul class="suggestions"></ul>
            </div>
            <div class="field-error"></div>
          </div>
        </div>
      </div>
    `;
  }).join("");
  addPersonBtn.disabled = peopleIds.length >= MAX_PEOPLE;
  peopleCountBadge.textContent = `${peopleIds.length}人`;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function addPerson() {
  if (peopleIds.length >= MAX_PEOPLE) return;
  peopleIds.push(nextId++);
  renderPeople();
}
function removePerson(id) {
  if (peopleIds.length <= MIN_PEOPLE) return;
  peopleIds = peopleIds.filter(x => x !== id);
  peopleData.delete(id);
  renderPeople();
}

for (let i = 0; i < 3; i++) { peopleIds.push(nextId++); }
renderPeople();

addPersonBtn.addEventListener("click", addPerson);
peopleGrid.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-remove]");
  if (btn) removePerson(Number(btn.dataset.remove));
});

// ---- 入力の状態保存 ----
peopleGrid.addEventListener("input", (e) => {
  const card = e.target.closest(".person");
  if (!card) return;
  const id = Number(card.dataset.id);
  const d = ensureData(id);
  if (e.target.classList.contains("p-name")) d.name = e.target.value;
  else if (e.target.classList.contains("p-work")) d.work = e.target.value;
  else if (e.target.classList.contains("p-home")) d.home = e.target.value;

  if (e.target.classList.contains("station-input")) {
    updateSuggestions(e.target);
    clearFieldError(e.target);
  }
});

// ---- 駅名オートコンプリート ----
function updateSuggestions(input) {
  const wrapper = input.closest(".station-field");
  const ul = wrapper.querySelector(".suggestions");
  const q = input.value.trim();
  if (!q) { ul.style.display = "none"; ul.innerHTML = ""; return; }
  const matches = STATIONS.filter(s => s[0].includes(q)).slice(0, 8);
  if (matches.length === 0) { ul.style.display = "none"; ul.innerHTML = ""; return; }
  ul.innerHTML = matches.map(s => `<li data-name="${escapeAttr(s[0])}">${s[0]}</li>`).join("");
  ul.style.display = "block";
}
function hideSuggestions(input) {
  const ul = input.closest(".station-field").querySelector(".suggestions");
  ul.style.display = "none";
}
function clearFieldError(input) {
  input.classList.remove("invalid");
  const errEl = input.closest(".field").querySelector(".field-error");
  errEl.textContent = "";
}
function validateField(input, requireFilled) {
  const val = input.value.trim();
  const errEl = input.closest(".field").querySelector(".field-error");
  if (!val) {
    input.classList.toggle("invalid", !!requireFilled);
    errEl.textContent = requireFilled ? "職場の最寄駅を入力してください" : "";
    return !requireFilled;
  }
  const valid = stationMap.has(val);
  input.classList.toggle("invalid", !valid);
  errEl.textContent = valid ? "" : "候補にない駅名です。候補一覧から選んでください";
  return valid;
}

peopleGrid.addEventListener("focusin", (e) => {
  if (e.target.classList.contains("station-input") && e.target.value.trim()) {
    updateSuggestions(e.target);
  }
});
peopleGrid.addEventListener("mousedown", (e) => {
  const li = e.target.closest(".suggestions li");
  if (!li) return;
  e.preventDefault();
  const input = li.closest(".station-field").querySelector(".station-input");
  input.value = li.dataset.name;
  input.dispatchEvent(new Event("input", { bubbles: true }));
  hideSuggestions(input);
  validateField(input, input.classList.contains("p-work"));
});
peopleGrid.addEventListener("focusout", (e) => {
  if (!e.target.classList.contains("station-input")) return;
  const input = e.target;
  setTimeout(() => {
    hideSuggestions(input);
    validateField(input, input.classList.contains("p-work"));
  }, 120);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".station-field")) {
    document.querySelectorAll(".suggestions").forEach(ul => ul.style.display = "none");
  }
});

// ---- モードタブ ----
const MODES = [
  { id: "total", label: "合計最短", desc: "全員の移動時間の合計が最も短い駅を優先します。" },
  { id: "fair", label: "公平重視", desc: "移動時間の差(一番遠い人と近い人の差)が最も小さい駅を優先します。" },
  { id: "lastTrain", label: "終電安心", desc: "解散予定時刻から逆算し、全員が最も余裕を持って終電に間に合う駅を優先します。" },
  { id: "fastest", label: "最速集合", desc: "最後の1人が到着するまでの時間が最も短い駅を優先します。" },
];
let currentMode = "total";
const modeTabs = document.getElementById("modeTabs");
const modeDesc = document.getElementById("modeDesc");
const lastTrainRow = document.getElementById("lastTrainRow");

function renderModeTabs() {
  modeTabs.innerHTML = "";
  MODES.forEach(m => {
    const btn = document.createElement("button");
    btn.textContent = m.label;
    if (m.id === currentMode) btn.classList.add("active");
    btn.addEventListener("click", () => { currentMode = m.id; renderModeTabs(); });
    modeTabs.appendChild(btn);
  });
  const active = MODES.find(m => m.id === currentMode);
  modeDesc.textContent = active.desc;
  lastTrainRow.style.display = currentMode === "lastTrain" ? "flex" : "none";
}
renderModeTabs();

// ---- 入力の収集とバリデーション ----
function collectPeople() {
  const cards = [...peopleGrid.querySelectorAll(".person")];
  const people = [];
  let hasError = false;

  cards.forEach((card, idx) => {
    const nameInput = card.querySelector(".p-name");
    const workInput = card.querySelector(".p-work");
    const homeInput = card.querySelector(".p-home");
    const work = workInput.value.trim();
    const home = homeInput.value.trim();

    if (!work && !home) { clearFieldError(workInput); clearFieldError(homeInput); return; }

    const workOk = validateField(workInput, true);
    const homeOk = validateField(homeInput, false);
    if (!workOk || !homeOk) { hasError = true; return; }

    const name = nameInput.value.trim() || `${idx + 1}人目`;
    people.push({ name, work, home: home || work });
  });

  if (hasError) return { error: "赤枠の駅名を修正してください(候補一覧から選択してください)" };
  if (people.length < MIN_PEOPLE) return { error: `最低${MIN_PEOPLE}人分は職場の最寄駅を入力してください` };
  return { people };
}

function minutesToClock(min) {
  const h = Math.floor(min / 60) % 24;
  const m = Math.round(min % 60);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

const formError = document.getElementById("formError");

document.getElementById("runBtn").addEventListener("click", () => {
  const { people, error } = collectPeople();
  if (error) {
    formError.textContent = error;
    formError.classList.add("show");
    return;
  }
  formError.classList.remove("show");

  const breakupTimeStr = document.getElementById("breakupTime").value || "21:30";
  const [bh, bm] = breakupTimeStr.split(":").map(Number);
  const breakupMinutes = bh * 60 + bm;

  const resultsEl = document.getElementById("results");
  const candidates = STATIONS.map(([name]) => name);
  const scored = candidates.map(candidate => {
    const legs = people.map(p => {
      const toCandidate = approxTravelMinutes(p.work, candidate);
      const toHome = approxTravelMinutes(candidate, p.home);
      const lastTrain = approxLastTrainMinutes(p.home);
      const requiredDeparture = (lastTrain !== null && toHome !== null) ? lastTrain - toHome : null;
      const margin = (requiredDeparture !== null) ? requiredDeparture - breakupMinutes : null;
      return { ...p, toCandidate, toHome, margin };
    });
    if (legs.some(l => l.toCandidate === null)) return null;

    const times = legs.map(l => l.toCandidate);
    const total = times.reduce((a,b) => a+b, 0);
    const max = Math.max(...times);
    const min = Math.min(...times);
    const spread = max - min;
    const margins = legs.map(l => l.margin).filter(m => m !== null);
    const minMargin = margins.length ? Math.min(...margins) : null;

    return { candidate, legs, total, max, spread, minMargin };
  }).filter(Boolean);

  let sorted;
  if (currentMode === "total") sorted = [...scored].sort((a,b) => a.total - b.total || a.max - b.max);
  else if (currentMode === "fair") sorted = [...scored].sort((a,b) => a.spread - b.spread || a.total - b.total);
  else if (currentMode === "fastest") sorted = [...scored].sort((a,b) => a.max - b.max || a.total - b.total);
  else sorted = [...scored].sort((a,b) => (b.minMargin ?? -9999) - (a.minMargin ?? -9999) || a.total - b.total);

  const top = sorted.slice(0, 6);
  resultsEl.innerHTML = "";
  top.forEach((r, idx) => {
    const div = document.createElement("div");
    div.className = "result-item" + (idx === 0 ? " rank-1" : "");
    const scoreText =
      currentMode === "total" ? `合計 約${r.total}分` :
      currentMode === "fair" ? `最大差 ${r.spread}分(合計 約${r.total}分)` :
      currentMode === "fastest" ? `最後の到着まで 約${r.max}分` :
      (r.minMargin !== null ? `最小余裕 ${r.minMargin >= 0 ? "+" : ""}${Math.round(r.minMargin)}分` : "終電データなし");

    const perPersonHtml = r.legs.map(l => {
      let extra = `${l.name}: 約${l.toCandidate}分`;
      if (currentMode === "lastTrain") {
        extra += ` / 帰宅約${l.toHome}分 / 余裕 ${l.margin !== null ? (l.margin >= 0 ? "+" : "") + Math.round(l.margin) + "分" : "―"}`;
      }
      return `<div>${extra}</div>`;
    }).join("");

    div.innerHTML = `
      <div class="result-head">
        <span class="station-name">${idx + 1}. ${r.candidate}駅</span>
        ${idx === 0 ? '<span class="badge">おすすめ</span>' : ''}
        <span class="score">${scoreText}</span>
      </div>
      <div class="per-person">${perPersonHtml}</div>
    `;
    resultsEl.appendChild(div);
  });

  if (top.length === 0) {
    resultsEl.innerHTML = `<p class="empty-hint">候補駅を計算できませんでした。駅名を確認してください。</p>`;
  }
});
</script>

const stationMap = new Map(STATIONS.map(s => [s[0], {lat:s[1], lon:s[2]}]));

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(h));
}
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h;
}
// 未登録駅(ユーザーが「未登録駅として使う」を選んだ場合)は駅名のハッシュから疑似配置する
function coordsFor(name) {
  if (stationMap.has(name)) return stationMap.get(name);
  const h = hashStr(name);
  const dx = ((h % 2000) / 2000 - 0.5) * 0.6;
  const dy = (((h >> 11) % 2000) / 2000 - 0.5) * 0.6;
  return { lat: 35.6812 + dy, lon: 139.7671 + dx };
}
// 駅間の概算所要時間(分)。直線距離×補正+乗換等の基礎時間+揺らぎ
function approxTravelMinutes(nameA, nameB) {
  if (!nameA || !nameB) return null;
  if (nameA === nameB) return 0;
  const a = coordsFor(nameA), b = coordsFor(nameB);
  const km = haversineKm(a, b);
  const jitter = Math.abs(hashStr(nameA + "|" + nameB) % 9) - 4;
  const minutes = km * 2.1 + 12 + jitter;
  return Math.max(5, Math.round(minutes));
}

function isFieldRequired(input) {
  const isWork = input.classList.contains("p-work");
  // 職場と自宅パターンは往路(職場→集合駅)と復路(集合駅→自宅)の合計で計算するため両方必須。
  // 自宅だけパターンは自宅が往路・復路どちらの起点にもなるので自宅のみ必須。
  return isWork ? departureMode === "workHome" : true;
}
function fieldLabelHtml(kind) {
  const required = kind === "work" ? departureMode === "workHome" : true;
  const base = kind === "work" ? "職場の最寄駅" : "自宅の最寄駅";
  return `${base}<span class="${required ? "required-mark" : "optional-mark"}">${required ? "必須" : "任意"}</span>`;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

  peopleIds = peopleIds.filter(x => x !== id);

  lastSearch = null;

}

// ---- 駅名オートコンプリート(候補にない場合は「未登録駅として使う」を提示) ----
function updateSuggestions(input) {
  const wrapper = input.closest(".station-field");
  const ul = wrapper.querySelector(".suggestions");
  const q = input.value.trim();
  if (!q) { ul.style.display = "none"; ul.innerHTML = ""; return; }
  const matches = STATIONS.filter(s => s[0].includes(q)).slice(0, 8);
  let html = matches.map(s => `<li data-name="${escapeAttr(s[0])}">${s[0]}</li>`).join("");
  if (matches.length === 0) {
    html = `<li class="no-match-option" data-manual="${escapeAttr(q)}">候補が見つかりません。「${q}」を未登録駅として使う(概算配置)</li>`;
  }
  ul.innerHTML = html;
  ul.style.display = "block";
}
function hideSuggestions(input) {
  const ul = input.closest(".station-field").querySelector(".suggestions");
  ul.style.display = "none";
}
function clearFieldError(input) {
  input.classList.remove("invalid", "override");
  const errEl = input.closest(".field").querySelector(".field-error");
  errEl.textContent = "";
  errEl.classList.remove("note");
}
function validateField(input, requireFilled) {
  const val = input.value.trim();
  const errEl = input.closest(".field").querySelector(".field-error");
  const fieldName = input.classList.contains("p-work") ? "職場" : "自宅";
  errEl.classList.remove("note");
  if (!val) {
    input.classList.remove("invalid", "override");
    input.classList.toggle("invalid", !!requireFilled);
    errEl.textContent = requireFilled ? `${fieldName}の最寄駅を入力してください` : "";
    return !requireFilled;
  }
  if (stationMap.has(val)) {
    input.classList.remove("invalid", "override");
    errEl.textContent = "";
    return true;
  }
  if (input.dataset.manual === val) {
    input.classList.remove("invalid");
    input.classList.add("override");
    errEl.textContent = "未登録駅として概算配置で計算します";
    errEl.classList.add("note");
    return true;
  }
  input.classList.add("invalid");
  input.classList.remove("override");
  errEl.textContent = "候補にない駅名です。候補から選ぶか、未登録駅として使うを選んでください";
  return false;
}

peopleGrid.addEventListener("focusin", (e) => {
  if (e.target.classList.contains("station-input") && e.target.value.trim()) {
    updateSuggestions(e.target);
  }
});
peopleGrid.addEventListener("mousedown", (e) => {
  const li = e.target.closest(".suggestions li");
  if (!li) return;
  e.preventDefault();
  const input = li.closest(".station-field").querySelector(".station-input");
  const isManual = li.classList.contains("no-match-option");
  input.value = isManual ? li.dataset.manual : li.dataset.name;
  input.dispatchEvent(new Event("input", { bubbles: true })); // clears any stale dataset.manual via the input listener below
  if (isManual) input.dataset.manual = li.dataset.manual;
  hideSuggestions(input);
  validateField(input, isFieldRequired(input));
});
peopleGrid.addEventListener("focusout", (e) => {
  if (!e.target.classList.contains("station-input")) return;

// ---- 状態の保存・復元(localStorage + 共有URL) ----
// URLの?state=を優先して復元し(共有リンクを開いた場合)、なければ前回訪問時の
// localStorageから復元する。復元後は自動ではURLを書き換えない(ブックマークURLが
// 勝手に汚れるのを避けるため)。以降、入力を変更するたびにURL・localStorage両方を更新する。
const STORAGE_KEY = "eki-finder-state-v1";
function currentStateObj() {
  return {
    day: departureMode,
    mode: currentMode,
    people: peopleIds.map(id => {
      const d = ensureData(id);
      return { n: d.name, w: d.work, h: d.home };
    }),
  };
}
function saveState() {
  const json = JSON.stringify(currentStateObj());
  try { localStorage.setItem(STORAGE_KEY, json); } catch (e) { /* 無効化されている場合は無視 */ }
  try {
    const url = new URL(location.href);
    url.searchParams.set("state", json);
    history.replaceState(null, "", url);
  } catch (e) { /* file://等replaceStateが使えない環境は無視 */ }
}
function loadState() {
  try {
    const fromUrl = new URLSearchParams(location.search).get("state");
    const json = fromUrl || localStorage.getItem(STORAGE_KEY);
    if (!json) return null;
    const s = JSON.parse(json);
    if (!s || !Array.isArray(s.people) || s.people.length < MIN_PEOPLE) return null;
    return s;
  } catch (e) { return null; }
}
function applyState(s) {
  if (s.day === "workHome" || s.day === "homeOnly") departureMode = s.day;
  if (MODES.some(m => m.id === s.mode)) currentMode = s.mode;
  peopleIds = [];
  peopleData.clear();
  nextId = 1;
  s.people.slice(0, MAX_PEOPLE).forEach(p => {
    const id = nextId++;
    peopleIds.push(id);
    peopleData.set(id, { name: p.n || "", work: p.w || "", home: p.h || "" });
  });
  renderDayToggle();
  renderPeople();
  renderModeTabs();
}
const restoredState = loadState();
if (restoredState) applyState(restoredState);

// ---- 入力の収集とバリデーション ----
function collectPeople() {
  const cards = [...peopleGrid.querySelectorAll(".person")];
  const people = [];
  let hasError = false;

  cards.forEach((card, idx) => {
    const nameInput = card.querySelector(".p-name");
    const workInput = card.querySelector(".p-work"); // 自宅だけモードでは非表示・DOM上に存在しない
    const homeInput = card.querySelector(".p-home");
    const work = workInput ? workInput.value.trim() : "";
    const home = homeInput.value.trim();

    if (!work && !home) { if (workInput) clearFieldError(workInput); clearFieldError(homeInput); return; }

    const workOk = workInput ? validateField(workInput, isFieldRequired(workInput)) : true;
    const homeOk = validateField(homeInput, isFieldRequired(homeInput));
    if (!workOk || !homeOk) { hasError = true; return; }

    const from = departureMode === "workHome" ? (work || home) : (home || work);
    const actualHome = home || work;
    const name = nameInput.value.trim() || `${idx + 1}人目`;
    people.push({
      name, from, home: actualHome,
      fromUnlisted: !!from && !stationMap.has(from),
      homeUnlisted: !!actualHome && !stationMap.has(actualHome),
    });
  });

  if (hasError) return { error: "赤枠の駅名を修正してください(候補から選ぶか、未登録駅として使うを選択してください)" };
  if (people.length < MIN_PEOPLE) {
    const need = departureMode === "workHome" ? "職場・自宅" : "自宅";
    return { error: `最低${MIN_PEOPLE}人分は${need}の最寄駅を入力してください` };
  }
  return { people };
}

// 範囲探索(実データ)を持つVercelサーバーレス関数。EKISPERT_API_KEYはここには置かず、
// サーバー側の環境変数として保持している。
const PROXY_BASE = "https://eki-finder.vercel.app/api/multi-range";
const REAL_DATA_MINUTES = 90; // 各人の上限探索時間(分)

async function fetchRealCandidates(names, minutes) {
  const url = `${PROXY_BASE}?stations=${encodeURIComponent(names.join(","))}&minutes=${minutes}`;
  const res = await fetch(url);
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || data.error) {
    throw new Error((data && data.error) || `HTTP ${res.status}`);
  }
  return data.candidates || [];
}

// 平日: 往路(職場→集合駅)と復路(集合駅→自宅)の両方を実データで取得し合計する。
// workCandidates/homeCandidatesは同じ駅コードで揃っているとは限らないため、
// 両方に含まれる(=全員が往復とも到達できる)駅だけを候補として残す。
function buildScoredFromReal(people, workCandidates, homeCandidates) {
  const homeByCode = new Map(homeCandidates.map(c => [c.code, c]));
  return workCandidates
    .filter(c => homeByCode.has(c.code))
    .map(c => {
      const homeC = homeByCode.get(c.code);
      const legs = people.map((p, i) => {
        const toCandidate = c.minutesByPerson[i];
        const toHome = homeC.minutesByPerson[i];
        const roundTrip = toCandidate + toHome;
        const transfersOut = c.transfersByPerson[i];
        const transfersHome = homeC.transfersByPerson[i];
        return { ...p, toCandidate, toHome, roundTrip, transfersOut, transfersHome };
      });
      const roundTrips = legs.map(l => l.roundTrip);
      const arrivals = legs.map(l => l.toCandidate);
      const total = roundTrips.reduce((a,b) => a+b, 0);
      const spread = Math.max(...roundTrips) - Math.min(...roundTrips);
      const max = Math.max(...arrivals); // 最速集合は到着(往路)のみで判定
      return { candidate: c.name, legs, total, max, spread };
    });
}

function buildScoredApprox(people) {
  const candidates = STATIONS.map(([name]) => name);
  return candidates.map(candidate => {
    const legs = people.map(p => {
      const toCandidate = approxTravelMinutes(p.from, candidate);
      const toHome = approxTravelMinutes(candidate, p.home);
      const roundTrip = toCandidate + toHome;
      return { ...p, toCandidate, toHome, roundTrip };
    });

    const roundTrips = legs.map(l => l.roundTrip);
    const arrivals = legs.map(l => l.toCandidate);
    const total = roundTrips.reduce((a,b) => a+b, 0);
    const spread = Math.max(...roundTrips) - Math.min(...roundTrips);
    const max = Math.max(...arrivals);

    return { candidate, legs, total, max, spread };
  });
}

function renderResults({ scored, usedReal, dataSourceNote, showsMark }) {
  const resultsEl = document.getElementById("results");

  const RESULT_COUNT = 6;
  let sorted;
  if (currentMode === "total") sorted = [...scored].sort((a,b) => a.total - b.total || a.max - b.max);
  else if (currentMode === "fair") {
    // spreadだけで比較すると、公平さのために全員の移動時間そのものが底上げされた
    // 駅(例: 全員片道40分で横並び)が、合計最短の駅(例: 片道21分)より上位に来てしまう。
    // そこで「合計最短」の上位RESULT_COUNT駅という現実的に速い候補に絞り込んでから、
    // その中で往復差が最も小さい駅を選ぶ。
    const fastestPool = [...scored].sort((a,b) => a.total - b.total || a.max - b.max).slice(0, RESULT_COUNT);
    sorted = fastestPool.sort((a,b) => a.spread - b.spread || a.total - b.total);
  }
  else sorted = [...scored].sort((a,b) => a.max - b.max || a.total - b.total); // fastest

  const top = sorted.slice(0, RESULT_COUNT);
  resultsEl.innerHTML = "";

  const sourceBanner = document.createElement("p");
  sourceBanner.className = "result-note" + (usedReal ? " source-real" : "");
  sourceBanner.textContent = dataSourceNote || "実データで計算しました(モード切替は再取得なし)";
  resultsEl.appendChild(sourceBanner);

  const cardsForImage = [];
  top.forEach((r, idx) => {
    const div = document.createElement("div");
    div.className = "result-item" + (idx === 0 ? " rank-1" : "");
    // 往復合計をランキングには使ったまま、表示は「1人あたり片道」に換算する
    // (往復2回ぶんの移動を人数で割った平均、= 通常イメージする片道の所要時間に近い)
    const perPersonOneWay = Math.round(r.total / (r.legs.length * 2));
    const oneWaySpread = Math.round(r.spread / 2); // 往復差も同様に片道換算
    const metric = currentMode === "fastest" ? r.max : perPersonOneWay;
    const scoreLabel = currentMode === "fastest" ? "最後の到着まで" : "1人あたり片道";
    const spreadText = currentMode === "fair" ? `みんなの差 ${oneWaySpread}分(片道換算)` : null;
    const spreadHtml = spreadText
      ? `<div class="score-sub">みんなの差 <b>${oneWaySpread}分</b>(片道換算)</div>`
      : "";

    const personLines = r.legs.map(l => {
      const unlisted = usedReal ? l.homeUnlisted : (l.fromUnlisted || l.homeUnlisted);
      const mark = unlisted ? " *" : "";
      // 誰がどの駅から来るか分かるよう、名前の横に出発駅(自宅だけモードは自宅駅、
      // 職場と自宅モードは職場駅→自宅駅)を添える
      const stationLabel = departureMode === "homeOnly" ? `(${l.home})` : `(${l.from}→${l.home})`;
      let extra;
      if (departureMode === "homeOnly") {
        // 自宅だけモードは往路=復路なので内訳を書かない
        extra = `${l.name}${stationLabel}${mark}: 往復${l.roundTrip}分(片道${l.toCandidate}分`;
        if (usedReal && l.transfersOut != null) extra += `・乗換${l.transfersOut}`;
        extra += `)`;
      } else {
        extra = `${l.name}${stationLabel}${mark}: 往復${l.roundTrip}分(往${l.toCandidate}分`;
        if (usedReal && l.transfersOut != null) extra += `・乗換${l.transfersOut}`;
        extra += `+復${l.toHome}分`;
        if (usedReal && l.transfersHome != null) extra += `・乗換${l.transfersHome}`;
        extra += `)`;
      }
      return extra;
    });
    const perPersonHtml = personLines.map(t => `<div>${t}</div>`).join("");

    div.innerHTML = `
      <div class="result-head">
        <span class="station-name">${idx + 1}. ${r.candidate}駅</span>
        ${idx === 0 ? '<span class="badge">おすすめ</span>' : ''}
      </div>
      <div class="score-hero">
        <span class="score-value">${metric}</span><span class="score-unit">分</span>
        <span class="score-label">${scoreLabel}</span>
      </div>
      ${spreadHtml}
      <div class="per-person">${perPersonHtml}</div>
    `;
    resultsEl.appendChild(div);

    cardsForImage.push({
      rank: idx + 1,
      isTop: idx === 0,
      candidate: r.candidate,
      metricText: `${metric}分`,
      scoreLabel,
      spreadText,
      personLines,
    });
  });

  if (showsMark) {
    const note = document.createElement("p");
    note.className = "result-note";
    note.textContent = usedReal
      ? "* 印の自宅は候補一覧にない駅のため、復路(集合駅→自宅)の時間は駅名から推定した概算位置で計算しています"
      : "* 印は未登録駅(候補一覧にない駅)のため、駅名から推定した概算位置で計算しています";
    resultsEl.appendChild(note);
  }

  if (top.length === 0) {
    resultsEl.innerHTML = `<p class="empty-hint">候補駅が見つかりませんでした。駅名や上限時間を確認してください。</p>`;
    return;
  }

  const shareBtn = document.createElement("button");
  shareBtn.className = "share-img-btn";
  shareBtn.textContent = "📷 画像で保存・共有";
  shareBtn.addEventListener("click", () => {
    const modeLabel = MODES.find(m => m.id === currentMode).label;
    shareResultImage(cardsForImage, {
      modeLabel,
      dataSourceText: sourceBanner.textContent,
    });
  });
  resultsEl.appendChild(shareBtn);
}

// ---- 結果を画像化して保存・共有 ----
function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function buildResultImageCanvas(cards, meta) {
  const W = 640;
  const PAD = 20;
  const FONT = '"Hiragino Sans", "Yu Gothic", sans-serif';
  const LINE_H = 20;
  const HEADER_H = 84;
  const SOURCE_H = 26;
  const SCALE = 2;

  let y = HEADER_H + SOURCE_H;
  const cardLayout = cards.map(c => {
    const cardY = y;
    let h = 14 + 26 + 36; // 上パディング + 駅名行 + スコア行
    if (c.spreadText) h += 20;
    h += c.personLines.length * LINE_H;
    h += 14; // 下パディング
    y += h + 10;
    return { y: cardY, h };
  });
  y += 24; // フッター

  const H = Math.ceil(y);
  const canvas = document.createElement("canvas");
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d");
  ctx.scale(SCALE, SCALE);
  ctx.textBaseline = "top";

  ctx.fillStyle = "#eef8f9";
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, "#0284c7");
  grad.addColorStop(1, "#0d9488");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HEADER_H);
  ctx.fillStyle = "#ffffff";
  ctx.font = `900 22px ${FONT}`;
  ctx.fillText("🚉 集合駅ナビ", PAD, 20);
  ctx.font = `700 14px ${FONT}`;
  ctx.fillText(meta.modeLabel, PAD, 54);

  ctx.fillStyle = "#5b7d87";
  ctx.font = `12px ${FONT}`;
  ctx.fillText(meta.dataSourceText, PAD, HEADER_H + 8);

  cards.forEach((c, idx) => {
    const { y: cardY, h: cardH } = cardLayout[idx];
    drawRoundedRect(ctx, PAD, cardY, W - PAD * 2, cardH, 12);
    ctx.fillStyle = c.isTop ? "#e0f2fe" : "#ffffff";
    ctx.fill();
    ctx.lineWidth = c.isTop ? 2 : 1;
    ctx.strokeStyle = c.isTop ? "#0284c7" : "#d6e9ec";
    ctx.stroke();

    let ty = cardY + 14;
    ctx.fillStyle = "#0f2a33";
    ctx.font = `900 17px ${FONT}`;
    ctx.fillText(`${c.rank}. ${c.candidate}駅${c.isTop ? "  ★おすすめ" : ""}`, PAD + 14, ty);
    ty += 28;

    ctx.fillStyle = "#0284c7";
    ctx.font = `900 26px ${FONT}`;
    ctx.fillText(c.metricText, PAD + 14, ty);
    const metricWidth = ctx.measureText(c.metricText).width;
    ctx.font = `700 12px ${FONT}`;
    ctx.fillStyle = "#5b7d87";
    ctx.fillText(c.scoreLabel, PAD + 14 + metricWidth + 8, ty + 10);
    ty += 34;

    if (c.spreadText) {
      ctx.font = `13px ${FONT}`;
      ctx.fillStyle = "#0f2a33";
      ctx.fillText(c.spreadText, PAD + 14, ty);
      ty += 20;
    }

    ctx.font = `13px ${FONT}`;
    ctx.fillStyle = "#0f2a33";
    c.personLines.forEach(line => {
      ctx.fillText(line, PAD + 14, ty);
      ty += LINE_H;
    });
  });

  ctx.fillStyle = "#5b7d87";
  ctx.font = `11px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText("kakeru110.github.io/eki-finder", W / 2, H - 20);
  ctx.textAlign = "left";

  return canvas;
}

async function shareResultImage(cards, meta) {
  const canvas = buildResultImageCanvas(cards, meta);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  if (!blob) return;
  const file = new File([blob], "集合駅ナビ.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "集合駅ナビ" });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // ユーザーが共有をキャンセルした場合は何もしない
      // 共有に失敗した場合はダウンロードにフォールバックする
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "集合駅ナビ.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const runBtn = document.getElementById("runBtn");
runBtn.addEventListener("click", async () => {
  const { people, error } = collectPeople();
  if (error) {
    formError.textContent = error;
    formError.classList.add("show");
    return;
  }
  formError.classList.remove("show");

  const hasUnlisted = people.some(p => p.fromUnlisted || p.homeUnlisted);
  const resultsEl = document.getElementById("results");
  lastSearch = null;
  resultsEl.innerHTML = `<p class="empty-hint">検索中(実データAPIに接続しています)...</p>`;
  runBtn.disabled = true;
  runBtn.textContent = "検索中...";

  let scored;
  let dataSourceNote = "";
  let usedReal = false;
  try {
    const workNames = people.map(p => p.from);
    const homeNames = people.map(p => p.home);
    // 自宅だけパターンは往路・復路の起点が同じ(自宅)なので、実データAPIの呼び出しを使い回して節約する
    let workCandidates, homeCandidates;
    if (departureMode === "workHome") {
      [workCandidates, homeCandidates] = await Promise.all([
        fetchRealCandidates(workNames, REAL_DATA_MINUTES),
        fetchRealCandidates(homeNames, REAL_DATA_MINUTES),
      ]);
    } else {
      workCandidates = await fetchRealCandidates(workNames, REAL_DATA_MINUTES);
      homeCandidates = workCandidates;
    }

    const merged = buildScoredFromReal(people, workCandidates, homeCandidates);
    if (merged.length === 0) {
      dataSourceNote = `実データAPIでは往復とも全員が${REAL_DATA_MINUTES}分以内に到達できる共通の駅が見つかりませんでした。移動時間の概算値で計算しています。`;
      scored = buildScoredApprox(people);
    } else {
      scored = merged;
      usedReal = true;
    }
  } catch (err) {
    dataSourceNote = "実データAPI(駅すぱあと)に接続できなかったため、移動時間の概算値で計算しています。";
    scored = buildScoredApprox(people);
  }

  // 実データ使用時は toCandidate(集合駅までの移動)は本物なので、未登録駅マークは
  // 復路計算(常に概算)に影響するhomeUnlistedのみを対象にする
  const showsMark = usedReal ? people.some(p => p.homeUnlisted) : hasUnlisted;

  lastSearch = { scored, usedReal, dataSourceNote, showsMark };
  renderResults(lastSearch);
  runBtn.disabled = false;
  runBtn.textContent = "合流駅を探す";
  resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>

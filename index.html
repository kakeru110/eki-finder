<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>合流駅ファインダー</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4fb;
    --card: #ffffff;
    --accent: #6d28d9;
    --accent-2: #db2777;
    --accent-soft: #f1ebfd;
    --text: #201a2e;
    --muted: #7a7690;
    --border: #eae6f5;
    --good: #16a34a;
    --warn: #b45309;
    --warn-soft: #fff7ec;
    --danger: #e11d48;
    --danger-soft: #fff1f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    font-size: 15px;
  }
  header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #6d28d9, #a21caf 55%, #db2777);
    color: #fff;
    padding: 18px 16px 16px;
  }
  header::before, header::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.35;
    background: #fff;
  }
  header::before { width: 140px; height: 140px; top: -70px; right: -30px; }
  header::after { width: 90px; height: 90px; bottom: -50px; left: 10%; opacity: 0.18; }
  header .head-row {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 720px;
    margin: 0 auto;
  }
  header h1 { margin: 0; font-size: 1.2rem; font-weight: 900; white-space: nowrap; }
  header p { position: relative; margin: 3px 0 0; opacity: 0.95; font-size: 0.78rem; max-width: 720px; margin-left: auto; margin-right: auto; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 12px 50px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(109,40,217,0.05);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 0.92rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card h2 .count-badge {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 8px;
  }
  .person {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 9px 9px;
    background: #fbfaff;
  }
  .person-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .person-head .p-name {
    flex: 1;
    border: none;
    background: transparent;
    font-weight: 700;
    font-size: 0.86rem;
    padding: 2px 2px;
    color: var(--text);
    min-width: 0;
    font-family: inherit;
  }
  .person-head .p-name::placeholder { color: #a79fc2; font-weight: 600; }
  .remove-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .p-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .field label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    margin: 0 0 2px 1px;
  }
  .station-field { position: relative; }
  .station-field input {
    width: 100%;
    padding: 6px 7px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.85rem;
    background: #fff;
    font-family: inherit;
  }
  .station-field input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .station-field input.invalid {
    border-color: var(--danger);
    background: var(--danger-soft);
  }
  .station-field input.override {
    border-color: #d97706;
    background: var(--warn-soft);
  }
  .field-error {
    font-size: 0.66rem;
    color: var(--danger);
    margin-top: 2px;
    min-height: 0;
  }
  .field-error.note { color: var(--warn); }
  .field-error:empty { display: none; }
  .suggestions {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(32,26,46,0.14);
    max-height: 200px;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 4px;
  }
  .suggestions li {
    padding: 6px 8px;
    border-radius: 7px;
    font-size: 0.83rem;
    cursor: pointer;
  }
  .suggestions li:hover,
  .suggestions li.active {
    background: var(--accent-soft);
  }
  .suggestions li.no-match-option {
    color: var(--warn);
    font-size: 0.76rem;
    border-top: 1px solid var(--border);
    margin-top: 2px;
    padding-top: 8px;
  }
  .suggestions li.no-match-option:hover { background: var(--warn-soft); }
  .add-person-btn {
    margin-top: 8px;
    width: 100%;
    padding: 8px;
    border: 1.5px dashed #cabbec;
    border-radius: 10px;
    background: #fff;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
  }
  .add-person-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    color: var(--muted);
  }
  .mode-tabs, .day-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .mode-tabs button, .day-toggle button {
    padding: 9px 6px;
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    font-family: inherit;
  }
  .mode-tabs button.active, .day-toggle button.active {
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 3px 10px rgba(109,40,217,0.28);
  }
  .day-toggle { margin-bottom: 4px; }
  .mode-desc {
    font-size: 0.76rem;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .required-mark, .optional-mark {
    display: inline-block;
    margin-left: 4px;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 999px;
    font-weight: 700;
    vertical-align: middle;
  }
  .required-mark { background: var(--accent-soft); color: var(--accent); }
  .optional-mark { background: rgba(122,118,144,0.15); color: var(--muted); }
  .inline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 0.8rem;
  }
  .inline-row input[type="time"] {
    padding: 5px 7px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: inherit;
  }
  .run-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(109,40,217,0.3);
  }
  .run-btn:active { opacity: 0.88; transform: translateY(1px); }
  .form-error {
    font-size: 0.78rem;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }
  .form-error.show { display: block; }
  .notice {
    font-size: 0.72rem;
    color: var(--warn);
    background: var(--warn-soft);
    border: 1px solid #f1dcb0;
    border-radius: 10px;
    padding: 7px 9px;
    margin-top: 8px;
  }
  #results { margin-top: 2px; }
  .result-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
  }
  .result-item.rank-1 {
    border-color: var(--accent);
    background: linear-gradient(135deg, var(--accent-soft), #fdf2f8);
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  .result-head .station-name {
    font-size: 0.98rem;
    font-weight: 700;
  }
  .result-head .badge {
    font-size: 0.68rem;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .result-head .score {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .per-person {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 4px 10px;
    margin-top: 6px;
    font-size: 0.76rem;
    color: var(--text);
  }
  .result-note {
    font-size: 0.68rem;
    color: var(--warn);
    margin-top: 6px;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 0.84rem;
    text-align: center;
    padding: 16px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
    padding: 8px 16px 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17131f;
      --card: #221c30;
      --accent: #a78bfa;
      --accent-2: #f472b6;
      --accent-soft: #2e2543;
      --text: #f1edfb;
      --muted: #9c93b5;
      --border: #362c4a;
      --warn-soft: #382b17;
      --danger-soft: #3a1620;
    }
    .person { background: #241d34; }
    .station-field input,
    .add-person-btn,
    .mode-tabs button,
    .day-toggle button,
    .suggestions { background: #1c1729; color: var(--text); }
    .result-item { background: #1c1729; }
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>🚉 合流駅ファインダー</h1>
  </div>
  <p>何人でも(2〜8人)の職場・自宅最寄駅を入力して、公平に集まれる駅を提案します</p>
</header>

<main>

  <section class="card">
    <h2>1. 最寄駅を入力 <span class="count-badge" id="peopleCountBadge"></span></h2>
    <div class="day-toggle" id="dayToggle">
      <button type="button" data-day="weekday" class="active">🏢 平日(職場から集合)</button>
      <button type="button" data-day="weekend">🏠 休日(自宅から集合)</button>
    </div>
    <p class="mode-desc" id="dayDesc"></p>
    <div class="people-grid" id="peopleGrid"></div>
    <button class="add-person-btn" id="addPersonBtn">＋ 人を追加</button>
  </section>

  <section class="card">
    <h2>2. 重視するモード</h2>
    <div class="mode-tabs" id="modeTabs"></div>
    <p class="mode-desc" id="modeDesc"></p>
    <div class="inline-row" id="lastTrainRow" style="display:none;">
      <label for="breakupTime">解散予定時刻</label>
      <input type="time" id="breakupTime" value="21:30">
    </div>
    <button class="run-btn" id="runBtn">合流駅を探す</button>
    <p class="form-error" id="formError"></p>
    <p class="notice">
      ⚠️ 実際の乗換案内APIに未接続のため、所要時間・終電は駅の位置関係からの<strong>概算値</strong>です。実際の乗換時間・終電時刻とは異なります。
    </p>
  </section>

  <section class="card">
    <h2>3. 提案結果</h2>
    <div id="results"><p class="empty-hint">駅を入力して「合流駅を探す」を押してください</p></div>
  </section>

</main>

<footer>
  合流駅ファインダー — 概算版(実データ未接続) / <span id="candidateCount"></span>駅を候補として計算
</footer>

const stationMap = new Map(STATIONS.map(s => [s[0], {lat:s[1], lon:s[2]}]));
document.getElementById("candidateCount").textContent = STATIONS.length;

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(h));
}
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h;
}
// 未登録駅(ユーザーが「未登録駅として使う」を選んだ場合)は駅名のハッシュから疑似配置する
function coordsFor(name) {
  if (stationMap.has(name)) return stationMap.get(name);
  const h = hashStr(name);
  const dx = ((h % 2000) / 2000 - 0.5) * 0.6;
  const dy = (((h >> 11) % 2000) / 2000 - 0.5) * 0.6;
  return { lat: 35.6812 + dy, lon: 139.7671 + dx };
}
// 駅間の概算所要時間(分)。直線距離×補正+乗換等の基礎時間+揺らぎ
function approxTravelMinutes(nameA, nameB) {
  if (!nameA || !nameB) return null;
  if (nameA === nameB) return 0;
  const a = coordsFor(nameA), b = coordsFor(nameB);
  const km = haversineKm(a, b);
  const jitter = Math.abs(hashStr(nameA + "|" + nameB) % 9) - 4;
  const minutes = km * 2.1 + 12 + jitter;
  return Math.max(5, Math.round(minutes));
}
// 概算終電時刻(分, 0:00起点。都心ほど遅く、郊外ほど早い想定)
function approxLastTrainMinutes(stationName) {
  const s = coordsFor(stationName);
  const center = { lat: 35.6812, lon: 139.7671 };
  const km = haversineKm(s, center);
  const t = 1470 - km * 1.5;
  return Math.max(1380, Math.min(1470, t));
}

}

const MIN_PEOPLE = 2;
const MAX_PEOPLE = 8;
let nextId = 1;
let peopleIds = [];
const peopleData = new Map(); // id -> {name, work, home}

function ensureData(id) {
  if (!peopleData.has(id)) peopleData.set(id, { name: "", work: "", home: "" });
  return peopleData.get(id);
}

const peopleGrid = document.getElementById("peopleGrid");
const addPersonBtn = document.getElementById("addPersonBtn");
const peopleCountBadge = document.getElementById("peopleCountBadge");

function renderPeople() {
  peopleGrid.innerHTML = peopleIds.map((id, idx) => {
    const d = ensureData(id);
    const canRemove = peopleIds.length > MIN_PEOPLE;
    return `
      <div class="person" data-id="${id}">
        <div class="person-head">
          <input class="p-name" placeholder="${idx + 1}人目の名前(任意)" value="${escapeAttr(d.name)}">
          <button class="remove-btn" data-remove="${id}" ${canRemove ? "" : "disabled"} title="この人を削除">✕</button>
        </div>
        <div class="p-fields">
          <div class="field">
            <label>${fieldLabelHtml("work")}</label>
            <div class="station-field">
              <input class="station-input p-work" autocomplete="off" placeholder="例: 新宿" value="${escapeAttr(d.work)}">
              <ul class="suggestions"></ul>
            </div>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label>${fieldLabelHtml("home")}</label>
            <div class="station-field">
              <input class="station-input p-home" autocomplete="off" placeholder="例: 町田" value="${escapeAttr(d.home)}">
              <ul class="suggestions"></ul>
            </div>
            <div class="field-error"></div>
          </div>
        </div>
      </div>
    `;
  }).join("");
  addPersonBtn.disabled = peopleIds.length >= MAX_PEOPLE;
  peopleCountBadge.textContent = `${peopleIds.length}人`;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function addPerson() {
  if (peopleIds.length >= MAX_PEOPLE) return;
  peopleIds.push(nextId++);
  renderPeople();
}
function removePerson(id) {
  if (peopleIds.length <= MIN_PEOPLE) return;
  peopleIds = peopleIds.filter(x => x !== id);
  peopleData.delete(id);
  renderPeople();
}

for (let i = 0; i < 3; i++) { peopleIds.push(nextId++); }

// ---- 駅名オートコンプリート(候補にない場合は「未登録駅として使う」を提示) ----
function updateSuggestions(input) {
  const wrapper = input.closest(".station-field");
  const ul = wrapper.querySelector(".suggestions");
  const q = input.value.trim();
  if (!q) { ul.style.display = "none"; ul.innerHTML = ""; return; }
  const matches = STATIONS.filter(s => s[0].includes(q)).slice(0, 8);
  let html = matches.map(s => `<li data-name="${escapeAttr(s[0])}">${s[0]}</li>`).join("");
  if (matches.length === 0) {
    html = `<li class="no-match-option" data-manual="${escapeAttr(q)}">候補が見つかりません。「${q}」を未登録駅として使う(概算配置)</li>`;
  }
  ul.innerHTML = html;
  ul.style.display = "block";
}
function hideSuggestions(input) {
  const ul = input.closest(".station-field").querySelector(".suggestions");
  ul.style.display = "none";
}
function clearFieldError(input) {
  input.classList.remove("invalid", "override");
  const errEl = input.closest(".field").querySelector(".field-error");
  errEl.textContent = "";
  errEl.classList.remove("note");
}
function validateField(input, requireFilled) {
  const val = input.value.trim();
  const errEl = input.closest(".field").querySelector(".field-error");
  const fieldName = input.classList.contains("p-work") ? "職場" : "自宅";
  errEl.classList.remove("note");
  if (!val) {
    input.classList.remove("invalid", "override");
    input.classList.toggle("invalid", !!requireFilled);
    errEl.textContent = requireFilled ? `${fieldName}の最寄駅を入力してください` : "";
    return !requireFilled;
  }
  if (stationMap.has(val)) {
    input.classList.remove("invalid", "override");
    errEl.textContent = "";
    return true;
  }
  if (input.dataset.manual === val) {
    input.classList.remove("invalid");
    input.classList.add("override");
    errEl.textContent = "未登録駅として概算配置で計算します";
    errEl.classList.add("note");
    return true;
  }
  input.classList.add("invalid");
  input.classList.remove("override");
  errEl.textContent = "候補にない駅名です。候補から選ぶか、未登録駅として使うを選んでください";
  return false;
}

peopleGrid.addEventListener("focusin", (e) => {
  if (e.target.classList.contains("station-input") && e.target.value.trim()) {
    updateSuggestions(e.target);
  }
});
peopleGrid.addEventListener("mousedown", (e) => {
  const li = e.target.closest(".suggestions li");
  if (!li) return;
  e.preventDefault();

  if (isManual) input.dataset.manual = li.dataset.manual;
  hideSuggestions(input);
  validateField(input, isFieldRequired(input));
});
peopleGrid.addEventListener("focusout", (e) => {
  if (!e.target.classList.contains("station-input")) return;

// ---- 入力の収集とバリデーション ----
function collectPeople() {
  const cards = [...peopleGrid.querySelectorAll(".person")];
  const people = [];
  let hasError = false;

  cards.forEach((card, idx) => {
    const nameInput = card.querySelector(".p-name");
    const workInput = card.querySelector(".p-work");
    const homeInput = card.querySelector(".p-home");
    const work = workInput.value.trim();
    const home = homeInput.value.trim();

    if (!work && !home) { clearFieldError(workInput); clearFieldError(homeInput); return; }

    const workOk = validateField(workInput, isFieldRequired(workInput));
    const homeOk = validateField(homeInput, isFieldRequired(homeInput));
    if (!workOk || !homeOk) { hasError = true; return; }

    const from = departureMode === "weekday" ? (work || home) : (home || work);
    const actualHome = home || work;
    const name = nameInput.value.trim() || `${idx + 1}人目`;
    people.push({
      name, from, home: actualHome,
      fromUnlisted: !!from && !stationMap.has(from),
      homeUnlisted: !!actualHome && !stationMap.has(actualHome),
    });
  });

  if (hasError) return { error: "赤枠の駅名を修正してください(候補から選ぶか、未登録駅として使うを選択してください)" };
  if (people.length < MIN_PEOPLE) {
    const need = departureMode === "weekday" ? "職場" : "自宅";
    return { error: `最低${MIN_PEOPLE}人分は${need}の最寄駅を入力してください` };
  }
  return { people };
}

const formError = document.getElementById("formError");

document.getElementById("runBtn").addEventListener("click", () => {
  const { people, error } = collectPeople();
  if (error) {
    formError.textContent = error;
    formError.classList.add("show");
    return;
  }
  formError.classList.remove("show");

  const breakupTimeStr = document.getElementById("breakupTime").value || "21:30";
  const [bh, bm] = breakupTimeStr.split(":").map(Number);
  const breakupMinutes = bh * 60 + bm;

  const hasUnlisted = people.some(p => p.fromUnlisted || p.homeUnlisted);
  const resultsEl = document.getElementById("results");
  const candidates = STATIONS.map(([name]) => name);
  const scored = candidates.map(candidate => {
    const legs = people.map(p => {
      const toCandidate = approxTravelMinutes(p.from, candidate);
      const toHome = approxTravelMinutes(candidate, p.home);
      const lastTrain = approxLastTrainMinutes(p.home);
      const requiredDeparture = lastTrain - toHome;
      const margin = requiredDeparture - breakupMinutes;
      return { ...p, toCandidate, toHome, margin };
    });

    const times = legs.map(l => l.toCandidate);
    const total = times.reduce((a,b) => a+b, 0);
    const max = Math.max(...times);
    const min = Math.min(...times);
    const spread = max - min;
    const minMargin = Math.min(...legs.map(l => l.margin));

    return { candidate, legs, total, max, spread, minMargin };
  });

  let sorted;
  if (currentMode === "total") sorted = [...scored].sort((a,b) => a.total - b.total || a.max - b.max);
  else if (currentMode === "fair") sorted = [...scored].sort((a,b) => a.spread - b.spread || a.total - b.total);
  else if (currentMode === "fastest") sorted = [...scored].sort((a,b) => a.max - b.max || a.total - b.total);
  else sorted = [...scored].sort((a,b) => b.minMargin - a.minMargin || a.total - b.total);

  const top = sorted.slice(0, 6);
  resultsEl.innerHTML = "";
  top.forEach((r, idx) => {
    const div = document.createElement("div");
    div.className = "result-item" + (idx === 0 ? " rank-1" : "");
    const scoreText =
      currentMode === "total" ? `合計 約${r.total}分` :
      currentMode === "fair" ? `最大差 ${r.spread}分(合計 約${r.total}分)` :
      currentMode === "fastest" ? `最後の到着まで 約${r.max}分` :
      `最小余裕 ${r.minMargin >= 0 ? "+" : ""}${Math.round(r.minMargin)}分`;

    const perPersonHtml = r.legs.map(l => {
      const mark = (l.fromUnlisted || l.homeUnlisted) ? " *" : "";
      let extra = `${l.name}${mark}: 約${l.toCandidate}分`;
      if (currentMode === "lastTrain") {
        extra += ` / 帰宅約${l.toHome}分 / 余裕 ${l.margin >= 0 ? "+" : ""}${Math.round(l.margin)}分`;
      }
      return `<div>${extra}</div>`;
    }).join("");

    div.innerHTML = `
      <div class="result-head">
        <span class="station-name">${idx + 1}. ${r.candidate}駅</span>
        ${idx === 0 ? '<span class="badge">おすすめ</span>' : ''}
        <span class="score">${scoreText}</span>
      </div>
      <div class="per-person">${perPersonHtml}</div>
    `;
    resultsEl.appendChild(div);
  });

  if (hasUnlisted) {
    const note = document.createElement("p");
    note.className = "result-note";
    note.textContent = "* 印は未登録駅(候補一覧にない駅)のため、駅名から推定した概算位置で計算しています";
    resultsEl.appendChild(note);
  }
});
</script>

</html>
